<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&amp;family=Nunito+Sans:wght@400;600&amp;display=swap');
      .brand { font-family: 'Montserrat', sans-serif; }
      .body  { font-family: 'Nunito Sans', sans-serif; }
    </style>
    <!-- Subtle grid pattern overlay -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background: navy primary surface -->
  <rect width="1200" height="628" fill="#103059"/>
  <!-- Grid overlay -->
  <rect width="1200" height="628" fill="url(#grid)"/>

  <!-- Gold accent bar left -->
  <rect x="0" y="0" width="8" height="628" fill="#F4B626"/>

  <!-- Gold accent bottom strip -->
  <rect x="0" y="570" width="1200" height="58" fill="#081A33" opacity="0.6"/>

  <!-- Eyebrow label -->
  <text x="72" y="130" font-family="Montserrat, sans-serif" font-weight="700" font-size="14"
        fill="#F4B626" letter-spacing="3" text-anchor="start">AP CALCULUS · UNIT 5</text>

  <!-- Main title line 1 -->
  <text x="72" y="220" font-family="Montserrat, sans-serif" font-weight="900" font-size="62"
        fill="#FFFFFF" text-anchor="start">Concavity and</text>

  <!-- Main title line 2 -->
  <text x="72" y="300" font-family="Montserrat, sans-serif" font-weight="900" font-size="62"
        fill="#FFFFFF" text-anchor="start">Inflection Points</text>

  <!-- Subtitle -->
  <text x="72" y="370" font-family="Nunito Sans, sans-serif" font-weight="600" font-size="26"
        fill="rgba(255,255,255,0.75)" text-anchor="start">The Rate-of-Rate-of-Change Story</text>
  <text x="72" y="410" font-family="Nunito Sans, sans-serif" font-weight="600" font-size="26"
        fill="rgba(255,255,255,0.75)" text-anchor="start">Your Textbook Skips</text>

  <!-- Gold accent underline under title -->
  <rect x="72" y="325" width="220" height="4" fill="#F4B626" rx="2"/>

  <!-- Math formula decorative element -->
  <text x="900" y="280" font-family="Montserrat, sans-serif" font-weight="700" font-size="48"
        fill="rgba(244,182,38,0.18)" text-anchor="middle">f&#8243;(x) &gt; 0</text>
  <text x="900" y="340" font-family="Montserrat, sans-serif" font-weight="700" font-size="28"
        fill="rgba(244,182,38,0.12)" text-anchor="middle">concave up</text>

  <!-- Bottom bar: brand + URL -->
  <text x="72" y="608" font-family="Montserrat, sans-serif" font-weight="700" font-size="16"
        fill="#F4B626" text-anchor="start">EngiNearU</text>
  <text x="200" y="608" font-family="Nunito Sans, sans-serif" font-weight="400" font-size="16"
        fill="rgba(255,255,255,0.5)" text-anchor="start">·</text>
  <text x="220" y="608" font-family="Nunito Sans, sans-serif" font-weight="400" font-size="16"
        fill="rgba(255,255,255,0.5)" text-anchor="start">enginearu.com</text>
</svg>

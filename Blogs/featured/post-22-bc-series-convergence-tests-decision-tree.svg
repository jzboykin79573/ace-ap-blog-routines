<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#B7CFE9" stroke-width="0.4" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="628" fill="#103059"/>
  <!-- Grid overlay -->
  <rect width="1200" height="628" fill="url(#grid)"/>

  <!-- Gold accent bar top -->
  <rect x="0" y="0" width="1200" height="6" fill="#F4B626"/>

  <!-- Left content area -->
  <!-- Eyebrow label -->
  <text x="72" y="130" font-family="Montserrat, sans-serif" font-weight="700" font-size="13" fill="#F4B626" letter-spacing="2.5">AP CALCULUS BC · UNIT 10</text>

  <!-- Main headline -->
  <text x="72" y="208" font-family="Montserrat, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF">Series Convergence</text>
  <text x="72" y="270" font-family="Montserrat, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF">Tests: Which One</text>
  <text x="72" y="332" font-family="Montserrat, sans-serif" font-weight="900" font-size="52" fill="#F4B626">Do You Use?</text>

  <!-- Divider line -->
  <rect x="72" y="360" width="80" height="4" fill="#F4B626"/>

  <!-- Sub -->
  <text x="72" y="415" font-family="Nunito Sans, sans-serif" font-weight="400" font-size="20" fill="#B7CFE9">Stop memorizing all 9 tests.</text>
  <text x="72" y="445" font-family="Nunito Sans, sans-serif" font-weight="400" font-size="20" fill="#B7CFE9">Start recognizing which one to run.</text>

  <!-- Brand -->
  <text x="72" y="570" font-family="Montserrat, sans-serif" font-weight="700" font-size="18" fill="#F4B626">enginearu.com</text>
  <text x="72" y="596" font-family="Nunito Sans, sans-serif" font-weight="400" font-size="15" fill="#729AC9">@apcalculustutor</text>

  <!-- Right: decision tree diagram (simplified) -->
  <!-- Root node -->
  <rect x="760" y="80" width="360" height="52" rx="8" fill="#0C2344" stroke="#F4B626" stroke-width="2"/>
  <text x="940" y="112" font-family="Montserrat, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">Does a_n → 0?</text>

  <!-- Arrow down -->
  <line x1="940" y1="132" x2="940" y2="162" stroke="#729AC9" stroke-width="2"/>
  <polygon points="940,168 934,156 946,156" fill="#729AC9"/>

  <!-- Identify form node -->
  <rect x="760" y="168" width="360" height="52" rx="8" fill="#0C2344" stroke="#729AC9" stroke-width="1.5"/>
  <text x="940" y="200" font-family="Montserrat, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">Identify the series form</text>

  <!-- Arrow down -->
  <line x1="940" y1="220" x2="940" y2="248" stroke="#729AC9" stroke-width="2"/>
  <polygon points="940,254 934,242 946,242" fill="#729AC9"/>

  <!-- Four branches -->
  <!-- Geometric -->
  <rect x="756" y="256" width="155" height="46" rx="6" fill="#081A33" stroke="#F4B626" stroke-width="1.5"/>
  <text x="833" y="281" font-family="Nunito Sans, sans-serif" font-weight="600" font-size="12" fill="#F4B626" text-anchor="middle">Geometric</text>
  <text x="833" y="296" font-family="Nunito Sans, sans-serif" font-size="11" fill="#B7CFE9" text-anchor="middle">|r| &lt; 1 → converge</text>

  <!-- p-series -->
  <rect x="929" y="256" width="193" height="46" rx="6" fill="#081A33" stroke="#729AC9" stroke-width="1.5"/>
  <text x="1025" y="281" font-family="Nunito Sans, sans-serif" font-weight="600" font-size="12" fill="#729AC9" text-anchor="middle">p-Series</text>
  <text x="1025" y="296" font-family="Nunito Sans, sans-serif" font-size="11" fill="#B7CFE9" text-anchor="middle">p &gt; 1 → converge</text>

  <!-- Arrow down -->
  <line x1="940" y1="302" x2="940" y2="328" stroke="#729AC9" stroke-width="2"/>
  <polygon points="940,334 934,322 946,322" fill="#729AC9"/>

  <!-- Alternating / Ratio / Comparison -->
  <rect x="756" y="336" width="155" height="46" rx="6" fill="#081A33" stroke="#729AC9" stroke-width="1.5"/>
  <text x="833" y="361" font-family="Nunito Sans, sans-serif" font-weight="600" font-size="12" fill="#729AC9" text-anchor="middle">Alternating</text>
  <text x="833" y="376" font-family="Nunito Sans, sans-serif" font-size="11" fill="#B7CFE9" text-anchor="middle">AST conditions</text>

  <rect x="929" y="336" width="193" height="46" rx="6" fill="#081A33" stroke="#729AC9" stroke-width="1.5"/>
  <text x="1025" y="361" font-family="Nunito Sans, sans-serif" font-weight="600" font-size="12" fill="#729AC9" text-anchor="middle">Ratio Test</text>
  <text x="1025" y="376" font-family="Nunito Sans, sans-serif" font-size="11" fill="#B7CFE9" text-anchor="middle">factorials/exponentials</text>

  <!-- More tests -->
  <rect x="756" y="416" width="155" height="46" rx="6" fill="#081A33" stroke="#729AC9" stroke-width="1.5"/>
  <text x="833" y="441" font-family="Nunito Sans, sans-serif" font-weight="600" font-size="12" fill="#729AC9" text-anchor="middle">Limit Comparison</text>
  <text x="833" y="456" font-family="Nunito Sans, sans-serif" font-size="11" fill="#B7CFE9" text-anchor="middle">rational functions</text>

  <rect x="929" y="416" width="193" height="46" rx="6" fill="#081A33" stroke="#729AC9" stroke-width="1.5"/>
  <text x="1025" y="441" font-family="Nunito Sans, sans-serif" font-weight="600" font-size="12" fill="#729AC9" text-anchor="middle">Integral Test</text>
  <text x="1025" y="456" font-family="Nunito Sans, sans-serif" font-size="11" fill="#B7CFE9" text-anchor="middle">decreasing, continuous</text>

  <!-- 9 tests label -->
  <text x="940" y="548" font-family="Nunito Sans, sans-serif" font-weight="600" font-size="14" fill="#B7CFE9" text-anchor="middle">9 tests. One decision tree.</text>
</svg>

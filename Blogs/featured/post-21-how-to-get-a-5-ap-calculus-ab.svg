<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#B7CFE9" stroke-width="0.4" opacity="0.08"/>
    </pattern>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&amp;family=Nunito+Sans:wght@400;600&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="628" fill="#103059"/>
  <!-- Grid overlay -->
  <rect width="1200" height="628" fill="url(#grid)"/>

  <!-- Gold accent bar top -->
  <rect x="0" y="0" width="1200" height="6" fill="#F4B626"/>

  <!-- Left content area -->
  <!-- Eyebrow label -->
  <text x="72" y="130" font-family="Montserrat, sans-serif" font-weight="700" font-size="13" fill="#F4B626" letter-spacing="2.5" text-transform="uppercase">AP CALCULUS AB</text>

  <!-- Main headline -->
  <text x="72" y="210" font-family="Montserrat, sans-serif" font-weight="900" font-size="56" fill="#FFFFFF">How to Get a 5</text>
  <text x="72" y="278" font-family="Montserrat, sans-serif" font-weight="900" font-size="56" fill="#FFFFFF">on AP Calculus AB</text>

  <!-- Subheadline -->
  <text x="72" y="340" font-family="Montserrat, sans-serif" font-weight="700" font-size="26" fill="#B7CFE9">The Exact Strategy That Works</text>

  <!-- Divider line -->
  <rect x="72" y="372" width="80" height="4" fill="#F4B626"/>

  <!-- Stat callout -->
  <text x="72" y="430" font-family="Nunito Sans, sans-serif" font-weight="400" font-size="20" fill="#B7CFE9">Only 19% of students score a 5.</text>
  <text x="72" y="460" font-family="Nunito Sans, sans-serif" font-weight="400" font-size="20" fill="#B7CFE9">Here's how to be one of them.</text>

  <!-- Brand -->
  <text x="72" y="570" font-family="Montserrat, sans-serif" font-weight="700" font-size="18" fill="#F4B626">enginearu.com</text>
  <text x="72" y="596" font-family="Nunito Sans, sans-serif" font-weight="400" font-size="15" fill="#729AC9">@apcalculustutor</text>

  <!-- Right decorative element: score badge -->
  <circle cx="960" cy="314" r="190" fill="#0C2344" opacity="0.7"/>
  <circle cx="960" cy="314" r="175" fill="none" stroke="#F4B626" stroke-width="3"/>

  <text x="960" y="265" font-family="Montserrat, sans-serif" font-weight="900" font-size="140" fill="#F4B626" text-anchor="middle">5</text>
  <text x="960" y="340" font-family="Montserrat, sans-serif" font-weight="700" font-size="24" fill="#FFFFFF" text-anchor="middle">AP SCORE</text>
  <text x="960" y="375" font-family="Nunito Sans, sans-serif" font-weight="400" font-size="17" fill="#B7CFE9" text-anchor="middle">target: 68/108 points</text>
</svg>
